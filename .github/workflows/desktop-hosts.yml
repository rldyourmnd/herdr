name: Desktop hosts
on:
  pull_request:
    paths:
      - 'contrib/desktop/**'
      - '.github/workflows/desktop-hosts.yml'
  push:
    branches: [master]
    paths:
      - 'contrib/desktop/**'
      - '.github/workflows/desktop-hosts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Verify desktop profile and environment contract
        run: python3 -m unittest discover -s contrib/desktop/tests -p 'test_*.py' -v
      - name: Parse all desktop Python sources
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path("contrib/desktop").rglob("*.py"):
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Install native terminal test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 xvfb xdotool
      - name: Verify the real terminal color replies and rendered window
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 contrib/desktop/tests/test_native_linux.py
      - name: Fetch the pinned stable runtime for input acceptance
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import urllib.request
          manifest = json.loads(Path("contrib/desktop/tests/runtime-fixture.json").read_text())
          assert manifest["version"] == "0.9.5"
          data = urllib.request.urlopen(manifest["url"]).read()
          assert hashlib.sha256(data).hexdigest() == manifest["sha256"]
          path = Path(os.environ["RUNNER_TEMP"]) / "herdr-desktop-runtime"
          path.write_bytes(data)
          path.chmod(0o755)
          PY
      - name: Verify keyboard, mouse and GUI reattachment through real Herdr
        run: xvfb-run -a /usr/bin/python3 contrib/desktop/tests/test_herdr_input_linux.py --herdr-binary "$RUNNER_TEMP/herdr-desktop-runtime"
